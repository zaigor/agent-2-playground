[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-scanner"
version = "0.1.0"
description = "Read-only, fee-aware opportunity scanner for Polymarket and Kalshi"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
trade = ["polymarket-client>=0.11"]  # only for `lp --live`; every other command is read-only

[project.scripts]
pm-scanner = "pm_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["pm_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
